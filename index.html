<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanyco Machining OEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15181c;
    --panel:#1b1f24;
    --grid:#20262c;
    --line:#2a3138;
    --text:#e7eaec;
    --text-muted:#8b949c;
    --amber:#f2a71b;
    --amber-dim:#3a2c14;
    --steel:#4f8fbf;
    --steel-dim:#152531;
    --green:#4caf7d;
    --green-dim:#122a1f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--text);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 24px;
  }
  .panel{
    position:relative;
    width:100%;
    max-width:800px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:64px 56px 52px;
  }
  .panel::before, .panel::after,
  .corner-br::before, .corner-br::after{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    border:2px solid var(--amber);
  }
  .panel::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .panel::after{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .corner-br{ position:relative; }
  .corner-br::before{ bottom:-1px; left:-1px; top:auto; border-right:none; border-top:none; }
  .corner-br::after{ bottom:-1px; right:-1px; top:auto; border-left:none; border-top:none; }

  header{
    display:flex;
    align-items:center;
    gap:24px;
    margin-bottom:48px;
  }
  .logo{
    height:76px;
    object-fit:contain;
  }
  .logo-fallback{
    height:76px;
    width:76px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--text-muted);
    letter-spacing:0.05em;
  }
  h1{
    margin:0;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:48px;
    letter-spacing:0.01em;
    color:var(--text);
  }
  .controls{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .ctrl{
    display:flex;
    align-items:center;
    gap:24px;
    padding:28px 32px;
    background:var(--bg);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    text-decoration:none;
    color:var(--text);
    transition:transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .ctrl:hover{
    transform:translateX(4px);
    background:var(--panel);
    border-left-color:var(--accent);
  }
  .ctrl .icon{
    flex:none;
    width:84px;
    height:84px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--accent-dim);
    padding:12px;
  }
  .ctrl .icon img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .ctrl .label{ flex:1; }
  .ctrl .label .name{
    font-weight:500;
    font-size:26px;
    margin-bottom:6px;
  }
  .ctrl .label .desc{
    font-size:18px;
    color:var(--text-muted);
  }
  .c-dashboard{ --accent:var(--amber); --accent-dim:var(--amber-dim); }
  .c-prs{ --accent:var(--steel); --accent-dim:var(--steel-dim); }
  .c-report{ --accent:var(--green); --accent-dim:var(--green-dim); }

  footer{
    margin-top:32px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    color:var(--text-muted);
    letter-spacing:0.04em;
    display:flex;
    justify-content:space-between;
  }
  @media (max-width:480px){
    .panel{ padding:40px 24px 32px; }
    h1{ font-size:32px; }
    .ctrl{ padding:20px 20px; gap:16px; }
    .ctrl .icon{ width:64px; height:64px; padding:10px; }
    .ctrl .label .name{ font-size:20px; }
    .ctrl .label .desc{ font-size:15px; }
    footer{ flex-direction:column; gap:4px; }
  }
</style>
</head>
<body>

  <div class="panel corner-br">
    <header>
      <img src="logo.png" alt="Sanyco Machining logo" class="logo"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-fallback',textContent:'SANYCO'}))">
      <div class="titles">
        <h1>Sanyco Machining OEE</h1>
      </div>
    </header>

    <div class="controls">
      <a class="ctrl c-dashboard" href="https://sanycoline6.sugidigital.org/dashboard/page19" target="_blank" rel="noopener">
        <span class="icon">
          <img src="logo2.png" alt="">
        </span>
        <span class="label">
          <div class="name">Live Dashboard</div>
          <div class="desc">Real-time OEE and machine status</div>
        </span>
      </a>

      <a class="ctrl c-prs" href="https://docs.google.com/spreadsheets/d/1gmiY5IkWSxf8Vwvy0JHlZXTfpNNHZvEX8jrAvd1hdwc/edit?gid=265869353#gid=265869353" target="_blank" rel="noopener">
        <span class="icon">
          <img src="logo3.png" alt="">
        </span>
        <span class="label">
          <div class="name">Production Record Sheet</div>
          <div class="desc">Data captured and shift entries</div>
        </span>
      </a>

      <a class="ctrl c-report" href="https://datastudio.google.com/reporting/2d2ec562-6da1-49bf-aaa2-6044cc73488a/page/page_12345" target="_blank" rel="noopener">
        <span class="icon">
          <img src="logo4.png" alt="">
        </span>
        <span class="label">
          <div class="name">Analytics Report</div>
          <div class="desc">Trends, graphs and summary</div>
        </span>
      </a>
    </div>

    <footer>
      <span>Sanyco Machining</span>
      <span>Line 6 monitoring</span>
    </footer>
  </div>

</body>
</html>
